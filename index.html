<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainRoulette 入口</title>
<style>
  html, body { margin: 0; background: transparent; }
  #msg { display: none; font: 700 18px/1.6 "Yu Gothic UI", "Meiryo", sans-serif; color: #fff;
         background: rgba(0,0,0,.6); padding: 12px 16px; border-radius: 10px; margin: 16px; }
</style>
</head>
<body>
<div id="msg">ChainRoulette に切り替えています…（アプリが起動していないときは、起動してからこのソースを再読込してください）</div>
<script>
  // このページは「入口」です。開いた瞬間に、同じPCで動いている ChainRoulette の配信画面へ切り替えます。
  // どこにもデータは送りません。?always=1 や ?scale=1.3 などはそのまま引き継ぎます。
  // ポートを変えている場合は ?port=8766 のように指定できます。
  (function () {
    var q = new URLSearchParams(location.search);
    var port = q.get('port') || '8765';
    q.delete('port');
    var rest = q.toString();
    var target = 'http://localhost:' + port + '/' + (rest ? '?' + rest : '');
    setTimeout(function () { document.getElementById('msg').style.display = 'block'; }, 1500);
    location.replace(target);
  })();
</script>
</body>
</html>
