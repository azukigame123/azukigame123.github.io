<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChainRoulette 入口</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #msg { display: none; position: fixed; left: 16px; top: 16px; right: 16px; z-index: 2;
         font: 700 18px/1.6 "Yu Gothic UI", "Meiryo", sans-serif; color: #fff;
         background: rgba(0,0,0,.6); padding: 12px 16px; border-radius: 10px; }
  #f { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; display: none; }
</style>
</head>
<body>
<div id="msg">ChainRoulette に切り替えています…（アプリが起動していないときは、起動してからこのソースを再読込してください）</div>
<iframe id="f" allow="autoplay" allowtransparency="true"></iframe>
<script>
  // このページは「入口」です。同じPCで動いている ChainRoulette の配信画面を出します。
  // どこにもデータは送りません。?always=1 や ?scale=1.3 などはそのまま引き継ぎます。
  // ポートを変えている場合は ?port=8766 のように指定できます。
  // 1) まず画面ごと切り替える → 2) 切り替わらないとき（配信ソフトが止めたとき）は、この中にはめ込んで出す
  // → 3) それも届かないときは、何がダメかを文字で出して、5秒ごとにやり直す（アプリをあとから起動してもOK）
  (function () {
    var q = new URLSearchParams(location.search);
    var port = q.get('port') || '8765';
    var mode = q.get('entry') || '';   // entry=frame ではじめからはめ込み
    q.delete('port'); q.delete('entry');
    var rest = q.toString();
    var path = '/' + (rest ? '?' + rest : '');
    var msg = document.getElementById('msg'), f = document.getElementById('f');
    function say(t) { msg.textContent = t; msg.style.display = 'block'; }
    function hide() { msg.style.display = 'none'; }
    function probe(host) {
      // 届くかだけ確かめる（中身は読まない）
      return fetch('http://' + host + ':' + port + '/api/ui/status', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { return true; }, function () { return false; });
    }
    var shown = false;
    function frame() {
      probe('127.0.0.1').then(function (ok127) {
        if (ok127) { if (!shown) { f.src = 'http://127.0.0.1:' + port + path; f.style.display = 'block'; shown = true; } hide(); return; }
        return probe('localhost').then(function (okLh) {
          if (okLh) { if (!shown) { f.src = 'http://localhost:' + port + path; f.style.display = 'block'; shown = true; } hide(); return; }
          say('ChainRoulette に届きません（ポート ' + port + '）。アプリが起動しているか確かめてください。5秒ごとにやり直しています…'
              + '（切り替え・はめ込みの両方ができませんでした）');
          setTimeout(frame, 5000);
        });
      });
    }
    if (mode === 'frame') { frame(); return; }
    setTimeout(function () { say('ChainRoulette に切り替えています…'); }, 1500);
    // 2.5秒たってもこのページのままなら、切り替えが止められている → はめ込みに切りかえ
    setTimeout(function () { frame(); }, 2500);
    try { location.replace('http://localhost:' + port + path); } catch (e) { frame(); }
  })();
</script>
</body>
</html>
